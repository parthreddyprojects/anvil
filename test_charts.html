<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<title>Chart Test</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
body{font-family:'Inter',sans-serif;max-width:960px;margin:0 auto;padding:40px}
h2{margin:40px 0 16px}
.chart{width:100%;height:450px;border:1px solid #e5e7eb;border-radius:8px;margin-bottom:40px}
</style>
</head><body>
<h1>Chart Type Test</h1>

<h2>1. Horizontal Bar</h2>
<div class="chart" id="c1"></div>

<h2>2. Vertical Bar</h2>
<div class="chart" id="c2"></div>

<h2>3. Waterfall</h2>
<div class="chart" id="c3"></div>

<h2>4. Line</h2>
<div class="chart" id="c4"></div>

<h2>5. Donut</h2>
<div class="chart" id="c5"></div>

<h2>6. Gauge</h2>
<div class="chart" id="c6"></div>

<script>
// 1. Horizontal Bar
echarts.init(document.getElementById('c1')).setOption({"xAxis":{"type":"value","axisLabel":{"fontSize":13,"fontWeight":"bold"}},"yAxis":{"type":"category","data":["ServiceNow NRR FY25","Workday NRR FY25","Workday Sub-2K NRR"],"axisLabel":{"fontSize":12,"width":250,"overflow":"break","fontFamily":"Inter"}},"series":[{"type":"bar","data":[{"value":127,"itemStyle":{"color":"#22c55e"}},{"value":105,"itemStyle":{"color":"#f59e0b"}},{"value":99,"itemStyle":{"color":"#ef4444"}}],"barWidth":"45%","label":{"show":true,"position":"right","fontSize":14,"fontWeight":"bold","fontFamily":"Inter"}}],"grid":{"left":260,"right":80,"top":20,"bottom":20},"tooltip":{"trigger":"axis"}});

// 2. Vertical Bar
echarts.init(document.getElementById('c2')).setOption({"xAxis":{"type":"category","data":["HCM","Financials","Planning"],"axisLabel":{"fontSize":11,"rotate":20,"fontFamily":"Inter"}},"yAxis":{"type":"value","axisLabel":{"fontSize":12}},"series":[{"type":"bar","data":[{"value":53,"itemStyle":{"color":"#2563eb","borderRadius":[4,4,0,0]}},{"value":25,"itemStyle":{"color":"#ef4444","borderRadius":[4,4,0,0]}},{"value":18,"itemStyle":{"color":"#f59e0b","borderRadius":[4,4,0,0]}}],"barWidth":"50%","label":{"show":true,"position":"top","fontSize":14,"fontWeight":"bold","fontFamily":"Inter"}}],"grid":{"bottom":80,"top":30},"tooltip":{"trigger":"axis"}});

// 3. Waterfall
echarts.init(document.getElementById('c3')).setOption({"xAxis":{"type":"category","data":["Gross ARR","Silent Contraction","Adaptive Risk","Net ARR"],"axisLabel":{"fontSize":11,"rotate":25,"fontFamily":"Inter"}},"yAxis":{"type":"value","axisLabel":{"fontSize":12}},"series":[{"type":"bar","stack":"wf","data":[0,7150,6950,0],"itemStyle":{"color":"transparent"},"emphasis":{"itemStyle":{"color":"transparent"}}},{"type":"bar","stack":"wf","data":[{"value":7700,"itemStyle":{"color":"#2563eb","borderRadius":[3,3,0,0]}},{"value":550,"itemStyle":{"color":"#ef4444","borderRadius":[3,3,0,0]}},{"value":200,"itemStyle":{"color":"#ef4444","borderRadius":[3,3,0,0]}},{"value":6950,"itemStyle":{"color":"#2563eb","borderRadius":[3,3,0,0]}}],"label":{"show":true,"position":"top","fontSize":14,"fontWeight":"bold","fontFamily":"Inter"},"barWidth":"50%"}],"grid":{"bottom":90,"top":30,"left":60,"right":30},"tooltip":{"trigger":"axis"}});

// 4. Line
echarts.init(document.getElementById('c4')).setOption({"xAxis":{"type":"category","data":["FY22","FY23","FY24","FY25","FY26E"],"axisLabel":{"fontSize":12,"fontFamily":"Inter"}},"yAxis":{"type":"value","axisLabel":{"fontSize":12}},"series":[{"type":"line","name":"Workday NRR","data":[120,115,110,105,101],"smooth":true,"lineStyle":{"width":3,"color":"#ef4444"},"itemStyle":{"color":"#ef4444"},"symbol":"circle","symbolSize":8,"label":{"show":true,"fontSize":12,"fontWeight":"bold","position":"top"}},{"type":"line","name":"ServiceNow NRR","data":[118,122,125,127,128],"smooth":true,"lineStyle":{"width":3,"color":"#22c55e"},"itemStyle":{"color":"#22c55e"},"symbol":"circle","symbolSize":8,"label":{"show":true,"fontSize":12,"fontWeight":"bold","position":"top"}}],"legend":{"show":true,"bottom":0,"textStyle":{"fontSize":12}},"tooltip":{"trigger":"axis"},"grid":{"top":30,"bottom":50,"left":50,"right":30}});

// 5. Donut
echarts.init(document.getElementById('c5')).setOption({"series":[{"type":"pie","radius":["40%","75%"],"data":[{"name":"Contracts with AI rights","value":20,"itemStyle":{"color":"#22c55e"}},{"name":"Need amendment","value":50,"itemStyle":{"color":"#f59e0b"}},{"name":"Unknown","value":30,"itemStyle":{"color":"#ef4444"}}],"label":{"fontSize":13,"fontFamily":"Inter","formatter":"{b}: {d}%"},"emphasis":{"itemStyle":{"shadowBlur":10}}}],"legend":{"show":true,"bottom":0,"fontSize":11},"tooltip":{"trigger":"item"}});

// 6. Gauge
echarts.init(document.getElementById('c6')).setOption({"series":[{"type":"gauge","data":[{"value":105,"name":"NRR %"}],"min":90,"max":130,"detail":{"fontSize":24},"axisLine":{"lineStyle":{"width":15,"color":[[0.3,"#ef4444"],[0.7,"#f59e0b"],[1,"#22c55e"]]}}}]});
</script>
</body></html>
