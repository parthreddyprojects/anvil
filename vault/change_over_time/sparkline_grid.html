<!-- VAULT: change_over_time / sparkline_grid — 2x2 mini sparkline grid with current values (Brent, Indian basket, Rupee, GRM) -->
<div class="card" id="vault-sparkgrid">
<style>
  #vault-sparkgrid {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: #fafafa;
    border-radius: 6px;
    padding: 28px 32px 20px;
    max-width: 540px;
    box-shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  #vault-sparkgrid .card-title {
    font: 600 15px/1.3 'Inter', sans-serif;
    color: #111;
    margin: 0 0 4px;
  }
  #vault-sparkgrid .card-subtitle {
    font: 400 11px/1.4 'Inter', sans-serif;
    color: #888;
    margin: 0 0 20px;
  }
  #vault-sparkgrid .sg-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  #vault-sparkgrid .sg-cell {
    background: #fff;
    border: 1px solid #e8e8e8;
    border-radius: 6px;
    padding: 16px 18px 12px;
    position: relative;
    overflow: hidden;
  }
  #vault-sparkgrid .sg-metric-label {
    font: 500 9px/1 'Inter', sans-serif;
    color: #888;
    text-transform: uppercase;
    letter-spacing: .8px;
    margin-bottom: 6px;
  }
  #vault-sparkgrid .sg-row {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 10px;
  }
  #vault-sparkgrid .sg-value {
    font: 700 22px/1 'JetBrains Mono', monospace;
    color: #111;
  }
  #vault-sparkgrid .sg-delta {
    font: 600 11px/1 'JetBrains Mono', monospace;
    padding: 2px 6px;
    border-radius: 3px;
  }
  #vault-sparkgrid .sg-delta.up { color: #dc2626; background: #fef2f2; }
  #vault-sparkgrid .sg-delta.down { color: #10b981; background: #ecfdf5; }
  #vault-sparkgrid .sg-delta.neg { color: #dc2626; background: #fef2f2; }
  #vault-sparkgrid .sg-spark {
    width: 100%;
    height: 32px;
  }
  #vault-sparkgrid .sg-spark polyline {
    fill: none;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  #vault-sparkgrid .sg-spark .spark-area {
    opacity: .08;
  }
  #vault-sparkgrid .sg-dot {
    r: 3;
  }
  #vault-sparkgrid .card-source {
    font: 400 9px/1.3 'Inter', sans-serif;
    color: #aaa;
    margin-top: 14px;
  }
</style>
