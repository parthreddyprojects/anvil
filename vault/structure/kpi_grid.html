<!-- VAULT: structure / kpi_grid — Dark KPI panels with colored left borders, mono values, and sub-labels -->
<div class="card" id="vault-example">
<div class="card-inner">

<p class="label red" style="margin-bottom:12px">Stranded</p>
<h3 class="card-title">22 Ships. 1.7 Million Tonnes. Stuck.</h3>

<!-- Cargo breakdown KPI grid -->
<div class="kpi-grid" style="grid-template-columns:1fr 1fr 1fr;margin-top:24px">
<div class="kpi" style="border-color:var(--red)"><div class="kl">Crude</div><div class="kv" style="color:var(--red)">1.67M</div><div class="kd" style="color:var(--muted)">tonnes · 4 tankers</div></div>
<div class="kpi" style="border-color:var(--red)"><div class="kl">LPG</div><div class="kv" style="color:var(--red)">320K</div><div class="kd" style="color:var(--muted)">tonnes · 6 tankers</div></div>
<div class="kpi" style="border-color:var(--amber)"><div class="kl">LNG</div><div class="kv" style="color:var(--amber)">200K</div><div class="kd" style="color:var(--muted)">tonnes · 1 tanker</div></div>
</div>

<!-- Company impact KPI grid -->
<div class="kpi-grid" style="grid-template-columns:1fr 1fr;margin-top:16px">
<div class="kpi" style="border-color:var(--red)"><div class="kl">Annual Import Bill</div><div class="kv" style="color:var(--red)">$266B</div><div class="kd" style="color:var(--red)">vs $100B baseline (+166%)</div></div>
<div class="kpi" style="border-color:var(--red)"><div class="kl">Current Account Deficit</div><div class="kv" style="color:var(--red)">3%+</div><div class="kd" style="color:var(--muted)">of GDP (vs 0.8% target)</div></div>
<div class="kpi" style="border-color:var(--amber)"><div class="kl">GDP Growth Impact</div><div class="kv" style="color:var(--amber)">−100bp</div><div class="kd" style="color:var(--muted)">6.6% vs 7%+</div></div>
<div class="kpi" style="border-color:var(--amber)"><div class="kl">Rupee</div><div class="kv" style="color:var(--amber)">₹92.64</div><div class="kd" style="color:var(--red)">Record low</div></div>
</div>

</div>
</div>
