<!-- VAULT: structure / quote_pair — Two opposing quotes side by side with colored borders -->
<div class="card" id="vault-example">
<div class="card-inner">

<p class="label red" style="margin-bottom:12px">Duration</p>
<h3 class="card-title">The Wrong Question Is "When Does the War End."</h3>
<p class="card-sub" style="margin-bottom:20px">The right question is "When are the mines cleared."</p>

<div class="grid-2" style="margin-bottom:20px">
<div class="quote-box" style="background:rgba(59,130,246,.08);border-left:3px solid var(--blue)"><div class="q-text" style="color:var(--text)">"The terms aren't good enough yet."</div><div class="q-attr" style="color:var(--blue)">Trump — March 15</div></div>
<div class="quote-box" style="background:rgba(255,59,59,.08);border-left:3px solid var(--red)"><div class="q-text" style="color:var(--text)">"We never asked for a ceasefire."</div><div class="q-attr" style="color:var(--red)">Iran FM Araghchi — March 15</div></div>
</div>

</div>
</div>
