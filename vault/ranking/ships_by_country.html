<div class="card-inner">

<div class="kpi" style="border-color:var(--red)"><div class="kl">Japan/Korea/EU</div><div class="kv" style="color:var(--red)">0</div><div class="kd" style="color:var(--red)">Nothing through</div></div>
</div>

</div>
