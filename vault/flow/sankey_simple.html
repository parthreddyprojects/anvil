<!-- VAULT: flow / sankey_simple — Simple CSS/SVG Sankey diagram showing crude stream redirection (4 sources → 1 hub → 1 destination) -->
<div class="card" id="vault-sankey">
<style>
  #vault-sankey {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: #fafafa;
    border-radius: 6px;
    padding: 28px 32px 20px;
    max-width: 640px;
    box-shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  #vault-sankey .card-title {
    font: 600 15px/1.3 'Inter', sans-serif;
    color: #111;
    margin: 0 0 4px;
  }
  #vault-sankey .card-subtitle {
    font: 400 11px/1.4 'Inter', sans-serif;
    color: #888;
    margin: 0 0 24px;
  }
  #vault-sankey .sankey-container {
    position: relative;
    height: 280px;
    margin-bottom: 16px;
  }
  #vault-sankey .sk-node {
    position: absolute;
    border-radius: 3px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
  }
  #vault-sankey .sk-node .sk-name {
    font: 500 10px/1.2 'Inter', sans-serif;
    color: #fff;
    text-align: center;
  }
  #vault-sankey .sk-node .sk-val {
    font: 700 12px/1 'JetBrains Mono', monospace;
    color: #fff;
    margin-top: 2px;
  }
  #vault-sankey .card-source {
    font: 400 9px/1.3 'Inter', sans-serif;
    color: #aaa;
    margin-top: 12px;
  }
</style>

<div class="card-title">Russia replaced Iraq as India's top supplier in 12 months</div>
<div class="card-subtitle">Crude oil import flow redirection &middot; million barrels per day, FY24</div>

<div class="sankey-container">
  <svg viewBox="0 0 600 260" width="100%" height="260" style="position:absolute;top:0;left:0">
    <defs>
      <linearGradient id="skGrad1" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#dc2626" stop-opacity=".35"/><stop offset="100%" stop-color="#334155" stop-opacity=".25"/></linearGradient>
      <linearGradient id="skGrad2" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#2563eb" stop-opacity=".35"/><stop offset="100%" stop-color="#334155" stop-opacity=".25"/></linearGradient>
      <linearGradient id="skGrad3" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#16a34a" stop-opacity=".35"/><stop offset="100%" stop-color="#334155" stop-opacity=".25"/></linearGradient>
      <linearGradient id="skGrad4" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#d97706" stop-opacity=".35"/><stop offset="100%" stop-color="#334155" stop-opacity=".25"/></linearGradient>
      <linearGradient id="skGrad5" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#334155" stop-opacity=".25"/><stop offset="100%" stop-color="#7c3aed" stop-opacity=".35"/></linearGradient>
    </defs>
    <!-- Flow paths: sources → India hub -->
    <!-- Russia (1.7 mb/d) — tallest band -->
    <path d="M 100 20 C 200 20, 230 60, 270 75" stroke="none" fill="url(#skGrad1)"/>
    <path d="M 100 78 C 200 78, 230 115, 270 125" stroke="none" fill="url(#skGrad1)"/>
    <path d="M 100 20 L 100 78" stroke="none" fill="#dc262640"/>
    <path d="M 270 75 L 270 125" stroke="none" fill="#33415530"/>
    <polygon points="100,20 100,78 270,125 270,75" fill="url(#skGrad1)" opacity=".6"/>

    <!-- Iraq (1.0 mb/d) -->
    <polygon points="100,90 100,125 270,145 270,130" fill="url(#skGrad2)" opacity=".6"/>

    <!-- Saudi (0.7 mb/d) -->
    <polygon points="100,137 100,162 270,170 270,150" fill="url(#skGrad3)" opacity=".6"/>

    <!-- UAE (0.4 mb/d) -->
    <polygon points="100,174 100,190 270,185 270,175" fill="url(#skGrad4)" opacity=".6"/>

    <!-- Hub → Refineries output -->
    <polygon points="330,60 330,200 500,70 500,190" fill="url(#skGrad5)" opacity=".5"/>
  </svg>

  <!-- Source nodes (left) -->
  <div class="sk-node" style="left:0;top:10px;width:96px;height:64px;background:#dc2626">
    <span class="sk-name">Russia</span>
    <span class="sk-val">1.7 mb/d</span>
  </div>
  <div class="sk-node" style="left:0;top:86px;width:96px;height:40px;background:#2563eb">
    <span class="sk-name">Iraq</span>
    <span class="sk-val">1.0 mb/d</span>
  </div>
  <div class="sk-node" style="left:0;top:135px;width:96px;height:30px;background:#16a34a">
    <span class="sk-name">Saudi Arabia</span>
    <span class="sk-val">0.7 mb/d</span>
  </div>
  <div class="sk-node" style="left:0;top:174px;width:96px;height:22px;background:#d97706">
    <span class="sk-name" style="font-size:9px">UAE</span>
    <span class="sk-val" style="font-size:10px">0.4 mb/d</span>
  </div>

  <!-- Hub node (center) -->
  <div class="sk-node" style="left:260px;top:50px;width:64px;height:150px;background:#334155">
    <span class="sk-name">India<br/>Imports</span>
    <span class="sk-val">4.7</span>
    <span class="sk-name" style="font-size:8px">mb/d</span>
  </div>

  <!-- Destination node (right) -->
  <div class="sk-node" style="left:500px;top:55px;width:82px;height:140px;background:#7c3aed">
    <span class="sk-name">Indian<br/>Refineries</span>
    <span class="sk-val">5.4</span>
    <span class="sk-name" style="font-size:8px">mb/d capacity</span>
  </div>
</div>

<div class="card-source">Source: Vortexa, PPAC &middot; FY24 import data</div>
</div>
