<!-- VAULT: part_to_whole / waffle_chart — 10x10 grid showing 42% Hormuz dependency with colored squares -->
<div class="card" id="vault-waffle">
<style>
  #vault-waffle {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: #fafafa;
    border-radius: 6px;
    padding: 28px 32px 20px;
    max-width: 480px;
    box-shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  #vault-waffle .card-title {
    font: 600 15px/1.3 'Inter', sans-serif;
    color: #111;
    margin: 0 0 4px;
  }
  #vault-waffle .card-subtitle {
    font: 400 11px/1.4 'Inter', sans-serif;
    color: #888;
    margin: 0 0 24px;
  }
  #vault-waffle .wf-grid {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 4px;
    max-width: 360px;
    margin: 0 auto 20px;
  }
  #vault-waffle .wf-cell {
    aspect-ratio: 1;
    border-radius: 3px;
    transition: transform .15s ease, opacity .3s ease;
    position: relative;
  }
  #vault-waffle .wf-cell:hover {
    transform: scale(1.15);
    z-index: 2;
  }
  #vault-waffle .wf-cell.active {
    background: #dc2626;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.08);
  }
  #vault-waffle .wf-cell.inactive {
    background: #e5e7eb;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.04);
  }
  /* Legend */
  #vault-waffle .wf-legend {
    display: flex;
    justify-content: center;
    gap: 24px;
    margin-bottom: 16px;
  }
  #vault-waffle .wf-legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font: 400 10px/1 'Inter', sans-serif;
    color: #666;
  }
  #vault-waffle .wf-legend-box {
    width: 14px;
    height: 14px;
    border-radius: 3px;
    flex-shrink: 0;
  }
  /* Big number callout */
  #vault-waffle .wf-callout {
    text-align: center;
    margin-bottom: 20px;
  }
  #vault-waffle .wf-big {
    font: 800 48px/1 'JetBrains Mono', monospace;
    color: #dc2626;
    letter-spacing: -2px;
  }
  #vault-waffle .wf-big-sub {
    font: 500 11px/1.4 'Inter', sans-serif;
    color: #888;
    margin-top: 4px;
  }
  #vault-waffle .wf-detail {
    display: flex;
    justify-content: center;
    gap: 32px;
    margin-top: 16px;
  }
  #vault-waffle .wf-stat {
    text-align: center;
  }
  #vault-waffle .wf-stat-val {
    font: 700 16px/1 'JetBrains Mono', monospace;
    color: #333;
  }
  #vault-waffle .wf-stat-label {
    font: 400 9px/1.2 'Inter', sans-serif;
    color: #888;
    margin-top: 3px;
  }
  #vault-waffle .card-source {
    font: 400 9px/1.3 'Inter', sans-serif;
    color: #aaa;
    margin-top: 16px;
  }
</style>

<div class="card-title">42% of India's crude transits Hormuz</div>
<div class="card-subtitle">Each square = 1% of total crude oil imports &middot; FY24</div>

<div class="wf-callout">
  <div class="wf-big">42%</div>
  <div class="wf-big-sub">of 4.7 mb/d passes through the Strait</div>
</div>

<div class="wf-grid" id="waffleGrid"></div>

<div class="wf-legend">
  <div class="wf-legend-item"><div class="wf-legend-box" style="background:#dc2626"></div>Via Hormuz (42 squares)</div>
  <div class="wf-legend-item"><div class="wf-legend-box" style="background:#e5e7eb"></div>Non-Hormuz routes (58 squares)</div>
</div>

<div class="wf-detail">
  <div class="wf-stat">
    <div class="wf-stat-val">2.0</div>
    <div class="wf-stat-label">mb/d via Hormuz</div>
  </div>
  <div class="wf-stat">
    <div class="wf-stat-val">2.7</div>
    <div class="wf-stat-label">mb/d other routes</div>
  </div>
  <div class="wf-stat">
    <div class="wf-stat-val">88%</div>
    <div class="wf-stat-label">LPG via Hormuz</div>
  </div>
</div>

<div class="card-source">Source: PPAC, Kpler vessel tracking &middot; FY24 average</div>

<script>
(function(){
  var grid = document.getElementById('waffleGrid');
  var active = 42;
  for (var i = 0; i < 100; i++) {
    var cell = document.createElement('div');
    cell.className = 'wf-cell ' + (i < active ? 'active' : 'inactive');
    cell.style.animationDelay = (i * 15) + 'ms';
    grid.appendChild(cell);
  }
})();
</script>
</div>
