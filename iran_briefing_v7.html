/* ============================================================
   Style DNA — Single source of truth for all visual styling
   Extracted from iran-crisis briefing_v6.html (approved design)
   ============================================================ */

/* Reset */
*{margin:0;padding:0;box-sizing:border-box}

/* Variables */
:root{
  --bg:#0a0a0a;
  --card-bg:#111;
  --red:#ff3b3b;
  --amber:#ffb020;
  --green:#34d399;
  --blue:#3b82f6;
  --purple:#a78bfa;
  --text:#e5e5e5;
  --muted:#888;
  --dim:#333
}

/* Scroll system */
html{scroll-snap-type:y mandatory;scroll-behavior:smooth;overflow-x:hidden}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden}
.mono{font-family:'JetBrains Mono',monospace}

/* Card system — full viewport, scroll-snap */
.card{min-height:100vh;min-height:100dvh;scroll-snap-align:start;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:60px 24px 56px;position:relative;overflow:hidden}
.card-inner{width:100%;max-width:600px;text-align:center}

/* Progress bar */
.progress{position:fixed;top:0;left:0;height:3px;background:var(--red);z-index:1000;transition:width .3s}

/* Card counter */
.card-counter{position:fixed;top:8px;right:12px;font:500 11px/1 'JetBrains Mono';color:var(--muted);z-index:1000;background:rgba(10,10,10,.7);padding:4px 8px;border-radius:4px;backdrop-filter:blur(4px)}

/* Typography */
.label{font-size:11px;text-transform:uppercase;letter-spacing:2px;color:var(--muted);font-weight:600}
.label.red{color:var(--red)}
.label.green{color:var(--green)}
.label.blue{color:var(--blue)}
.label.amber{color:var(--amber)}
.card-title{font:800 28px/1.1 'Inter';margin-bottom:16px;max-width:600px;text-align:center}
.card-sub{font:400 14px/1.5 'Inter';color:var(--muted);max-width:440px;margin-left:auto;margin-right:auto;text-align:center}
.hero-num{font:800 72px/1 'JetBrains Mono';letter-spacing:-2px}

/* Stat row */
.stat-row{display:flex;gap:32px;margin:24px 0;flex-wrap:wrap;justify-content:center}
.stat{text-align:center}
.stat .val{font:700 42px/1 'JetBrains Mono';letter-spacing:-1px}
.stat .lbl{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-top:4px}

/* Mixed panels — dark and light */
.panel-dark{background:#1a1a1a;border-radius:8px;padding:16px;border-left:3px solid var(--dim)}
.panel-dark .kl{font:500 10px/1 'Inter';text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:6px}
.panel-dark .kv{font:700 28px/1 'JetBrains Mono'}
.panel-dark .kd{font:600 11px/1 'JetBrains Mono';margin-top:4px}
.panel-light{background:#fafafa;border-radius:12px;padding:20px;color:#1a1a1a;text-align:left}
.panel-light .p-label{font:700 14px/1 'Inter';color:#1a1a1a;margin-bottom:2px}
.panel-light .p-sub{font:400 10px/1.2 'Inter';color:#888;margin-bottom:10px}

/* Verdict banners */
.source-panel{background:#fafafa;border-radius:12px;overflow:hidden;color:#1a1a1a;text-align:left;margin-bottom:10px}
.verdict{padding:10px 20px;display:flex;justify-content:space-between;align-items:center}
.verdict .v-source{font:800 14px/1 'Inter';color:#fff}
.verdict .v-msg{font:700 11px/1 'JetBrains Mono';color:#fff;letter-spacing:.5px}
.panel-body{padding:16px 20px}

/* Grids */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:10px}

/* KPI grid — dark panels */
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:100%;max-width:520px;margin:16px auto}
.kpi{padding:14px;background:#1a1a1a;border-radius:6px;border-left:3px solid var(--dim)}
.kpi .kl{font:500 10px/1 'Inter';text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:6px}
.kpi .kv{font:700 28px/1 'JetBrains Mono'}
.kpi .kd{font:600 11px/1 'JetBrains Mono';margin-top:4px}

/* Maps: white tiles, inside light panels */
.map-c{width:100%;height:55vh;max-height:340px;border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,.15);position:relative;box-shadow:0 4px 24px rgba(0,0,0,.4)}
.map-c .leaflet-control-attribution,.map-c .leaflet-control-zoom{display:none}
.map-label{background:rgba(255,255,255,.9)!important;border:none!important;font:500 10px/1.4 'Inter'!important;color:#333!important;padding:3px 7px!important;border-radius:3px!important;pointer-events:none;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.map-label-red{color:#cc2020!important;font-weight:700!important;border-left:2px solid #dc2626!important;background:rgba(255,255,255,.92)!important}
.map-label-green{color:#1a7a4a!important;font-weight:700!important;border-left:2px solid #16a34a!important;background:rgba(255,255,255,.92)!important}
.leaflet-div-icon{background:none!important;border:none!important}

/* Pulsing map marker */
.pulse-marker{width:12px;height:12px;background:var(--red);border-radius:50%;box-shadow:0 0 10px var(--red);animation:mapPulse 2s infinite}
@keyframes mapPulse{0%{box-shadow:0 0 0 0 rgba(255,59,59,.7)}70%{box-shadow:0 0 0 15px rgba(255,59,59,0)}100%{box-shadow:0 0 0 0 rgba(255,59,59,0)}}

/* Charts inside light panels */
.chart-c{width:100%;height:220px;position:relative}
.chart-c canvas{width:100%!important;height:100%!important}

/* Before/after comparison */
.compare-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--dim)}
.compare-row .cr-label{font:500 12px/1 'Inter';color:var(--muted);width:100px}
.compare-row .cr-before{font:600 18px/1 'JetBrains Mono';color:var(--muted)}
.compare-row .cr-arrow{color:var(--red);font-size:20px;margin:0 8px}
.compare-row .cr-after{font:700 22px/1 'JetBrains Mono';color:var(--red)}

/* Bars (before/after butterfly) */
.ba-row{display:flex;gap:3px;align-items:center;height:36px;margin-bottom:4px}
.ba-half{width:50%;height:100%;display:flex}
.ba-half.left{justify-content:flex-end}
.ba-center{width:2px;height:100%;background:#ccc;flex-shrink:0}
.ba-bar{height:100%;border-radius:4px;display:flex;align-items:center;padding:0 10px;font:700 11px/1 'JetBrains Mono';color:#fff;white-space:nowrap}
.ba-axis{text-align:center;font:500 8px/1 'JetBrains Mono';color:#aaa;margin:4px 0 8px}

/* Voyage bars */
.v-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.v-label{font:500 10px/1 'Inter';width:100px;flex-shrink:0;color:#666}
.v-track{flex:1;height:22px;background:#eee;border-radius:3px;overflow:hidden}
.v-fill{height:100%;border-radius:3px;display:flex;align-items:center;padding-left:8px;font:700 9px/1 'JetBrains Mono';color:#fff}
.v-days{font:600 10px/1 'JetBrains Mono';width:55px;text-align:right;flex-shrink:0}

/* Animated timeline */
.timeline{position:relative;padding-left:28px;width:100%;max-width:500px;text-align:left}
.timeline::before{content:'';position:absolute;left:8px;top:0;bottom:0;width:2px;background:var(--dim)}
.tl-item{position:relative;margin-bottom:16px;opacity:0}
.tl-item::before{content:'';position:absolute;left:-24px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--red);box-shadow:0 0 8px var(--red);animation:mapPulse 2s infinite}
.tl-item.amber::before{background:var(--amber);box-shadow:0 0 8px var(--amber)}
.tl-item .tl-time{font:600 12px/1 'JetBrains Mono';color:var(--red);margin-bottom:2px}
.tl-item.amber .tl-time{color:var(--amber)}
.tl-item .tl-text{font:400 13px/1.4 'Inter';color:var(--text)}
.card.in-view .tl-item{animation:fadeSlide .5s ease forwards}
.card.in-view .tl-item:nth-child(1){animation-delay:.1s}
.card.in-view .tl-item:nth-child(2){animation-delay:.2s}
.card.in-view .tl-item:nth-child(3){animation-delay:.3s}
.card.in-view .tl-item:nth-child(4){animation-delay:.4s}
.card.in-view .tl-item:nth-child(5){animation-delay:.5s}
.card.in-view .tl-item:nth-child(6){animation-delay:.6s}
.card.in-view .tl-item:nth-child(7){animation-delay:.7s}
.card.in-view .tl-item:nth-child(8){animation-delay:.8s}
.card.in-view .tl-item:nth-child(9){animation-delay:.9s}
.card.in-view .tl-item:nth-child(10){animation-delay:1s}
@keyframes fadeSlide{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}

/* Scenario cards — full bleed */
.scenario-card{border-radius:12px;padding:24px;width:100%;max-width:520px;margin:10px auto;text-align:left}
.scenario-card .sc-prob{font:800 52px/1 'JetBrains Mono';margin-bottom:6px}
.scenario-card .sc-title{font:700 18px/1.1 'Inter';margin-bottom:10px}
.scenario-card .sc-stats{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.scenario-card .sc-stat{padding:6px 10px;background:rgba(0,0,0,.3);border-radius:6px}
.scenario-card .sc-stat .ss-v{font:700 14px/1 'JetBrains Mono'}
.scenario-card .sc-stat .ss-l{font:400 9px/1 'Inter';color:rgba(255,255,255,.5);margin-top:2px}
.scenario-card .sc-insight{font:400 12px/1.4 'Inter';color:rgba(255,255,255,.7);margin-top:8px}

/* Dominoes — falling animation */
.dominoes{display:flex;gap:8px;width:100%;max-width:520px;margin:16px auto;align-items:flex-end;justify-content:center}
.domino{flex:1;min-width:60px;padding:14px 6px;background:#1a1a1a;border:1px solid var(--dim);border-radius:6px;text-align:center;opacity:0}
.domino .d-val{font:700 18px/1 'JetBrains Mono';margin-bottom:4px}
.domino .d-name{font:500 9px/1.2 'Inter';color:var(--muted)}
.card.in-view .domino{animation:dominoFall .5s ease forwards}
.card.in-view .domino:nth-child(1){animation-delay:.1s}
.card.in-view .domino:nth-child(2){animation-delay:.2s}
.card.in-view .domino:nth-child(3){animation-delay:.3s}
.card.in-view .domino:nth-child(4){animation-delay:.4s}
.card.in-view .domino:nth-child(5){animation-delay:.5s}
.card.in-view .domino:nth-child(6){animation-delay:.6s}
.card.in-view .domino:nth-child(7){animation-delay:.7s}
.card.in-view .domino:nth-child(8){animation-delay:.8s}
@keyframes dominoFall{from{opacity:0;transform:rotateX(90deg) translateY(-10px)}to{opacity:1;transform:rotateX(0) translateY(0)}}

/* Dot grid — ship visualization */
.dot-grid{display:grid;grid-template-columns:repeat(11,1fr);gap:4px;width:100%;max-width:300px;margin:12px auto}
.dot{width:100%;aspect-ratio:1;border-radius:50%;transition:all .3s}

/* Insight box */
.insight{margin:16px 0 0;padding:10px 14px;background:rgba(255,59,59,.06);border-left:3px solid var(--red);border-radius:0 6px 6px 0;width:100%;font:500 12px/1.4 'Inter';color:var(--text);text-align:left}
.insight.g{background:rgba(52,211,153,.06);border-color:var(--green)}
.insight.a{background:rgba(255,176,32,.06);border-color:var(--amber)}
.insight.b{background:rgba(59,130,246,.06);border-color:var(--blue)}
.src{font:400 9px/1 'Inter';color:var(--dim);margin-top:6px;text-align:center}

/* Quote boxes */
.quote-box{padding:14px 16px;border-radius:8px;margin-bottom:8px;text-align:left}
.quote-box .q-text{font:600 14px/1.4 'Inter';margin-bottom:6px}
.quote-box .q-attr{font:500 10px/1 'Inter';opacity:.7}

/* Checklist */
.checklist{text-align:left;width:100%;max-width:520px;margin:0 auto}
.cl-item{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid #1a1a1a}
.cl-item .cl-num{font:800 28px/1 'JetBrains Mono';color:var(--red);min-width:36px}
.cl-item .cl-action{font:600 13px/1.3 'Inter';margin-bottom:4px}
.cl-item .cl-deadline{font:600 10px/1 'JetBrains Mono';color:var(--amber)}

/* Act breaks */
.act-card{background:var(--bg)}
.act-card .act-num{font:800 120px/1 'JetBrains Mono';color:#1a1a1a;position:absolute;right:20px;bottom:20px}
.act-title{font:900 14px/1 'Inter';text-transform:uppercase;letter-spacing:4px;color:var(--red);margin-bottom:12px}

/* Swipe hint */
.swipe-hint{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);animation:sh 2s ease-in-out infinite;opacity:.4;font:500 11px/1 'Inter';color:var(--muted);letter-spacing:1px;text-transform:uppercase}
.swipe-hint::after{content:'';display:block;width:16px;height:16px;margin:6px auto 0;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg)}
@keyframes sh{0%,100%{opacity:.3;transform:translateX(-50%) translateY(0)}50%{opacity:.6;transform:translateX(-50%) translateY(-6px)}}

/* Countdown pulse */
@keyframes countPulse{0%,100%{opacity:1}50%{opacity:.7}}
.countdown{animation:countPulse 1.5s ease-in-out infinite}

/* Responsive */
@media(max-width:480px){
  .card{padding:44px 14px 36px}
  .card-title{font-size:22px}
  .hero-num{font-size:48px}
  .stat .val{font-size:28px}
  .map-c{height:45vh}
  .grid-2,.grid-3{grid-template-columns:1fr}
  .scenario-card .sc-prob{font-size:40px}
  .dominoes{flex-wrap:wrap}
  .domino{min-width:45px}
}

</style>
</head>

<h3 class="card-title" style="font-size:26px;max-width:480px;margin:0 auto 28px"></h3>
<div style="max-width:460px;margin:0 auto;text-align:left">

</div>


</div>
</div>
<script>
// Scroll: progress + counter + in-view animations
(function(){
var cards=document.querySelectorAll('.card'),
    prog=document.getElementById('prog'),
    ctr=document.getElementById('ctr'),
    t=cards.length;
function u(){
  var s=window.scrollY||document.documentElement.scrollTop,
      h=document.documentElement.scrollHeight-window.innerHeight,
      p=h>0?(s/h)*100:0;
  prog.style.width=p+'%';
  var c=1;
  cards.forEach(function(x,i){
    var r=x.getBoundingClientRect();
    if(r.top<window.innerHeight/2) c=i+1;
    if(r.top<window.innerHeight*.8&&r.bottom>0) x.classList.add('in-view');
    else x.classList.remove('in-view');
  });
  ctr.textContent=c+'/'+t;
}
window.addEventListener('scroll',u);
u();
})();

// Tile URL for all Leaflet maps — EXCLUSIVELY white tiles
var TILE='https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png';

// Map label helper
function ml(t,c,w){return L.divIcon({className:'map-label'+(c==='red'?' map-label-red':c==='green'?' map-label-green':''),html:t,iconSize:[w||120,20]})}

// Pulse marker helper
function pm(){return L.divIcon({className:'',html:'<div class="pulse-marker"></div>',iconSize:[12,12],iconAnchor:[6,6]})}

// Global Chart.js defaults
Chart.defaults.font.family='Inter';
Chart.defaults.color='#888';

// ── Chart & Map initializations ──
(function(){
var m=L.map('map-c20',{zoomControl:false,attributionControl:false,dragging:false,scrollWheelZoom:false}).setView([25,56],5);
L.tileLayer(TILE).addTo(m);
})();
(function(){
var m=L.map('map-c24',{zoomControl:false,attributionControl:false,dragging:false,scrollWheelZoom:false}).setView([25,56],5);
L.tileLayer(TILE).addTo(m);
})();
</script>
</body>
</html>
