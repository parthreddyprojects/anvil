<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;600&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#fff; display:flex; justify-content:center; align-items:center; min-height:100vh; }
  .card { width:1200px; height:800px; background:#fff; position:relative; overflow:hidden; }
  svg { width:100%; height:100%; }
</style>
</head>
<body>
<div class="card">
<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C97800" stop-opacity="0"/>
      <stop offset="30%" stop-color="#C97800" stop-opacity="1"/>
      <stop offset="70%" stop-color="#C97800" stop-opacity="1"/>
      <stop offset="100%" stop-color="#C97800" stop-opacity="0"/>
    </linearGradient>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#C97800" opacity="0.5"/>
    </marker>
    <marker id="arrowGrey" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#D4C9B8" opacity="0.6"/>
    </marker>
    <filter id="nodeShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000" flood-opacity="0.06"/>
    </filter>
    <filter id="vaultGlow">
      <feDropShadow dx="0" dy="3" stdDeviation="10" flood-color="#C97800" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="5" height="800" fill="url(#accent)"/>

  <!-- Title -->
  <text x="80" y="60" font-family="Inter" font-weight="300" font-size="13" fill="#999" letter-spacing="4">THE COMPOUNDING LOOP</text>

  <!-- Center of wheel -->
  <!-- cx=500, cy=390 -->

  <!-- Outer ring — dashed circle -->
  <circle cx="500" cy="390" r="200" fill="none" stroke="#EDE4D4" stroke-width="1.5" stroke-dasharray="6,8"/>

  <!-- Curved arrows between nodes (arcs along the circle) -->
  <!-- 5 nodes at angles: 270(top), 342, 54, 126, 198 degrees -->
  <!-- Arcs go clockwise between each pair -->
  <path d="M 500,190 A 200,200 0 0,1 690,300" fill="none" stroke="#E0D5C4" stroke-width="2" marker-end="url(#arrowGrey)"/>
  <path d="M 695,310 A 200,200 0 0,1 620,570" fill="none" stroke="#E0D5C4" stroke-width="2" marker-end="url(#arrowGrey)"/>
  <path d="M 610,575 A 200,200 0 0,1 380,570" fill="none" stroke="#D4C0A0" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <path d="M 370,565 A 200,200 0 0,1 305,305" fill="none" stroke="#C97800" stroke-width="2.5" marker-end="url(#arrowAmber)" opacity="0.6"/>
  <path d="M 310,295 A 200,200 0 0,1 490,192" fill="none" stroke="#C97800" stroke-width="2.5" marker-end="url(#arrowAmber)" opacity="0.6"/>

  <!-- Center text -->
  <text x="500" y="378" font-family="Inter" font-weight="900" font-size="48" fill="#C97800" text-anchor="middle">n+1</text>
  <text x="500" y="406" font-family="Inter" font-weight="500" font-size="13" fill="#888" text-anchor="middle">Every run improves</text>
  <text x="500" y="424" font-family="Inter" font-weight="500" font-size="13" fill="#888" text-anchor="middle">the next</text>

  <!-- NODE 1: Problem In (top, 270°) -->
  <g filter="url(#nodeShadow)">
    <circle cx="500" cy="168" r="26" fill="#FFF9F0" stroke="#E8D5B0" stroke-width="1.5"/>
  </g>
  <text x="500" y="174" font-family="Inter" font-weight="700" font-size="16" fill="#C97800" text-anchor="middle">1</text>
  <text x="500" y="122" font-family="Inter" font-weight="700" font-size="14" fill="#1a1a1a" text-anchor="middle">Problem In</text>
  <text x="500" y="139" font-family="Inter" font-weight="400" font-size="11" fill="#999" text-anchor="middle">New strategic question</text>

  <!-- NODE 2: Pipeline (upper-right, ~342°) -->
  <g filter="url(#nodeShadow)">
    <circle cx="700" cy="290" r="26" fill="#FFF9F0" stroke="#E8D5B0" stroke-width="1.5"/>
  </g>
  <text x="700" y="296" font-family="Inter" font-weight="700" font-size="16" fill="#C97800" text-anchor="middle">2</text>
  <text x="770" y="268" font-family="Inter" font-weight="700" font-size="14" fill="#1a1a1a" text-anchor="start">Anvil Pipeline</text>
  <text x="770" y="285" font-family="Inter" font-weight="400" font-size="11" fill="#999" text-anchor="start">Decompose, research,</text>
  <text x="770" y="299" font-family="Inter" font-weight="400" font-size="11" fill="#999" text-anchor="start">stress-test, brief</text>

  <!-- NODE 3: Output (lower-right, ~54°) -->
  <g filter="url(#nodeShadow)">
    <circle cx="630" cy="570" r="26" fill="#F0FAF0" stroke="#BBE5BB" stroke-width="1.5"/>
  </g>
  <text x="630" y="576" font-family="Inter" font-weight="700" font-size="16" fill="#16A34A" text-anchor="middle">3</text>
  <text x="700" y="558" font-family="Inter" font-weight="700" font-size="14" fill="#1a1a1a" text-anchor="start">Output</text>
  <text x="700" y="575" font-family="Inter" font-weight="400" font-size="11" fill="#999" text-anchor="start">Sourced brief +</text>
  <text x="700" y="589" font-family="Inter" font-weight="400" font-size="11" fill="#999" text-anchor="start">proof charts</text>

  <!-- NODE 4: Senior Review (lower-left, ~126°) -->
  <g filter="url(#nodeShadow)">
    <circle cx="370" cy="570" r="26" fill="#F0F4FF" stroke="#BFDBFE" stroke-width="1.5"/>
  </g>
  <text x="370" y="576" font-family="Inter" font-weight="700" font-size="16" fill="#2563EB" text-anchor="middle">4</text>
  <text x="300" y="618" font-family="Inter" font-weight="700" font-size="14" fill="#1a1a1a" text-anchor="middle">Senior Review</text>
  <text x="300" y="635" font-family="Inter" font-weight="400" font-size="11" fill="#999" text-anchor="middle">Tag reasoning, overrides</text>

  <!-- NODE 5: Vault (upper-left, ~198°) — special, larger, amber -->
  <g filter="url(#vaultGlow)">
    <circle cx="300" cy="290" r="32" fill="#C97800"/>
  </g>
  <text x="300" y="298" font-family="Inter" font-weight="800" font-size="20" fill="#FFF" text-anchor="middle">V</text>
  <text x="220" y="268" font-family="Inter" font-weight="700" font-size="14" fill="#1a1a1a" text-anchor="end">Vault</text>
  <text x="220" y="285" font-family="Inter" font-weight="400" font-size="11" fill="#999" text-anchor="end">Institutional memory</text>
  <text x="220" y="299" font-family="Inter" font-weight="400" font-size="11" fill="#999" text-anchor="end">compounds</text>

  <!-- Right annotation -->
  <text x="920" y="600" font-family="Inter" font-weight="400" font-size="13" fill="#888" text-anchor="start">Run 1 — generic intelligence</text>
  <text x="920" y="624" font-family="Inter" font-weight="400" font-size="13" fill="#888" text-anchor="start">Run 50 — recognizes your patterns</text>
  <text x="920" y="648" font-family="Inter" font-weight="600" font-size="13" fill="#C97800" text-anchor="start">Run 200 — compounds kick in</text>

  <!-- Footnote -->
  <text x="80" y="760" font-family="Inter" font-weight="400" font-size="12" fill="#BBB">Your team builds the vault and review layer around Anvil</text>

</svg>
</div>
</body>
</html>
